server:
  port: 8080

spring:
  application:
    name: srm-erp-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/srm_erp}
    username: ${DB_USERNAME:srm_user}
    password: ${DB_PASSWORD:srm_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: srm
    open-in-view: false
  flyway:
    enabled: true
    default-schema: srm
    schemas: srm
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

srm:
  storage:
    documents-dir: ${SRM_DOCUMENTS_DIR:./var/srm-documents}
  security:
    jwt:
      secret: ${SRM_JWT_SECRET:local-development-secret-change-this-before-deployment-2026}
      expiration-seconds: ${SRM_JWT_EXPIRATION_SECONDS:3600}
  notifications:
    email:
      enabled: ${SRM_EMAIL_ENABLED:false}
      from: ${SRM_EMAIL_FROM:no-reply@srm.local}
      public-base-url: ${SRM_PUBLIC_BASE_URL:http://localhost:4200}
      max-attempts: ${SRM_EMAIL_MAX_ATTEMPTS:5}
      poll-interval-ms: ${SRM_EMAIL_POLL_INTERVAL_MS:30000}
