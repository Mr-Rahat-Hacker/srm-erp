server:
  port: 8080

spring:
  application:
    name: srm-erp-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/srm_erp}
    username: ${DB_USERNAME:srm_user}
    password: ${DB_PASSWORD:srm_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: srm
    open-in-view: false
  flyway:
    enabled: true
    default-schema: srm
    schemas: srm

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

srm:
  storage:
    documents-dir: ${SRM_DOCUMENTS_DIR:./var/srm-documents}
  security:
    jwt:
      secret: ${SRM_JWT_SECRET:local-development-secret-change-this-before-deployment-2026}
      expiration-seconds: ${SRM_JWT_EXPIRATION_SECONDS:3600}
