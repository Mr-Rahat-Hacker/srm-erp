services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - .:/workspaces/srm-erp:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - srm-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: srm_erp
      POSTGRES_USER: srm_user
      POSTGRES_PASSWORD: srm_local_password
    ports:
      - "5432:5432"
    volumes:
      - srm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_user -d srm_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - srm-network

volumes:
  srm_postgres_data:

networks:
  srm-network:
