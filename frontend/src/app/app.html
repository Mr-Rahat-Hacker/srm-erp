<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="SRM home">
      <span class="brand-mark">S</span>
      <span class="brand-copy">
        <strong>SRM Platform</strong>
        <small>Supplier Relationship Management</small>
      </span>
    </a>
    <div class="nav-section-label">WORKSPACE</div>
    <nav class="main-nav" aria-label="Main navigation">
      @for (item of navigation; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>Development environment</span></div>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <div><span class="eyebrow">SRM WORKSPACE</span><div class="topbar-title">Procurement collaboration platform</div></div>
      <div class="user-area"><span class="environment-tag">LOCAL / CLOUD DEV</span><span class="avatar" aria-label="Development user">D</span></div>
    </header>
    <section class="page-content"><router-outlet /></section>
  </main>
</div>
